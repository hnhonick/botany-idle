<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seed & Sun</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game">
    <header class="game-header">
      <h1>Seed & Sun</h1>
      <p>Grow plants, discover species, and learn how they work.</p>
    </header>

    <section class="plant-area">
      <div class="stats">
        <p>
          <strong>Stored Energy:</strong>
          <span id="energy">0</span>
          /
          <span id="energyGoal">10</span>
        </p>

        <p>
          <strong>Growth Stage:</strong>
          <span id="stage">Seed</span>
        </p>

        <p id="moistureStat" hidden>
          <strong>Moisture:</strong>
          <span id="moisture">Good</span>
        </p>

        <p id="efficiencyStat" hidden>
          <strong>Photosynthesis Efficiency:</strong>
          <span id="efficiency">100%</span>
        </p>

        <p>
          <strong>Photosynthesis:</strong>
          <span id="passiveRate">0</span>
          energy/sec
        </p>
      </div>

      <div
        id="moistureMeterContainer"
        class="moisture-meter-container"
        hidden
      >
        <div class="moisture-labels">
          <span>Dry</span>
          <span>Good</span>
          <span>Saturated</span>
        </div>

        <div class="moisture-meter">
          <div class="good-zone"></div>
          <div
            id="moistureMarker"
            class="moisture-marker">
          </div>
        </div>
      </div>

      <div
        class="window"
        id="windowScene"
      >
        <div
          class="shutters closed"
          id="shutters"
        >
          <div class="shutter shutter-left"></div>
          <div class="shutter shutter-right"></div>
          <div class="light-crack"></div>
        </div>

        <div
          class="sun"
          id="sun"
          hidden
        >
          ☀️
        </div>

        <div
          class="plant-display dimmed"
          id="plantDisplay"
        >
          <div
            id="plantVisual"
            class="plant-visual"
          >
            ·
          </div>

          <div class="pot">
            🪴
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="openShuttersButton">
          Open Shutters
        </button>

        <button
          id="lightButton"
          hidden
        >
          Provide Light
        </button>

        <button
          id="waterButton"
          hidden
        >
          Water
        </button>
      </div>

      <div class="progress-section">
        <label for="growthProgress">
          Progress to next stage
        </label>

        <progress
          id="growthProgress"
          value="0"
          max="10">
        </progress>
      </div>

      <div
        id="message"
        class="message"
        aria-live="polite"
      >
        Something is waiting in the dark.
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
